<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学生古诗词自主学习与默写测试系统</title>
    <script src="poem_data.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #16a085;
            --bg-color: #f8f9fa;
            --grid-size: 50px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background-color: var(--bg-color); color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 25px; font-size: 26px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        /* 🗂️ 首页 Tab 选项卡样式 */
        .tabs-container { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 25px; gap: 10px; }
        .tab-button { padding: 12px 30px; border: none; background: #f1f5f9; color: #64748b; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.3s; margin-bottom: -2px; border: 2px solid transparent; border-bottom: none; }
        .tab-button:hover { background: #e2e8f0; color: var(--primary-color); }
        .tab-button.active { background: #fff; color: var(--accent-color); border-color: #e2e8f0; border-top: 4px solid var(--accent-color); padding-bottom: 14px; }
        
        /* 列表容器控制 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .btn { display: inline-block; padding: 10px 20px; background: var(--primary-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.3s; text-decoration: none; }
        .btn:hover { background: var(--accent-color); }
        .btn-secondary { background: #7f8c8d; }
        
        /* 首页索引网格样式 */
        .poem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .poem-card { background: #fdfefe; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .poem-card:hover { transform: translateY(-2px); box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        #study-panel .poem-card:hover { border-color: #3498db; }
        #test-panel .poem-card:hover { border-color: var(--accent-color); }
        
        .poem-info .title { font-weight: bold; color: var(--primary-color); font-size: 17px; margin-bottom: 4px; }
        .poem-info .author { font-size: 13px; color: #7f8c8d; }
        .stat-badge { background: #edf2f7; color: #4a5568; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap; }
        .stat-badge.completed { background: #e6fffa; color: #319795; }

        /* 内容页与顶部标题样式 */
        #content-page { display: none; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .current-mode-tag { font-size: 14px; font-weight: bold; padding: 5px 12px; border-radius: 20px; }
        .tag-study { background: #ebf5fb; color: #2980b9; }
        .tag-test { background: #e6fffa; color: #319795; }
        
        .poem-title-view { text-align: center; margin-bottom: 20px; }
        .poem-title-view h2 { color: var(--primary-color); font-size: 24px; margin-bottom: 12px; }
        .poem-title-view .author-line { color: #7f8c8d; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 52px; }
        .author-text-node { font-size: 17px; color: #555; font-weight: 500; font-family: "KaiTi", "楷体", serif; }
        
        /* ✍️ 测试模式专属：整行无暗示填空输入框样式 */
        .blank-input { width: 130px; height: 36px; border: none; border-bottom: 2px solid #ccafaf; background: transparent; text-align: center; font-size: 18px; font-family: "KaiTi", "楷体", serif; font-weight: bold; color: #2c3e50; outline: none; transition: all 0.3s; padding: 0 5px; }
        .blank-input:focus { border-bottom-color: var(--accent-color); background: rgba(22, 160, 133, 0.05); }
        .blank-input.correct { border: 1px solid #27ae60; background-color: #ebf5fb; border-radius: 4px; color: #27ae60; }
        .blank-input.wrong { border: 1px solid #c0392b; background-color: #fdedec; border-radius: 4px; color: #c0392b; }
        .author-line .punctuation { font-size: 18px; font-weight: bold; color: #7f8c8d; }

        /* 核心方格布局排版 */
        .poem-content-area { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: 30px 0; }
        .poem-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; margin-bottom: 5px; }
        
        /* 仿标准米字格结构 */
        .char-box { width: var(--grid-size); height: var(--grid-size); border: 1px solid #ccafaf; background: #ffffff; position: relative; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500; font-family: "KaiTi", "楷体", serif; color: #2c3e50; }
        .char-box::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-top: 1px dashed #f2e6e6; border-left: 1px dashed #f2e6e6; transform: translate(0, 0); pointer-events: none; }
        .char-box::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top right, transparent 49.5%, #f9eded 49.5%, #f9eded 50.5%, transparent 50.5%), linear-gradient(to top left, transparent 49.5%, #f9eded 49.5%, #f9eded 50.5%, transparent 50.5%); pointer-events: none; }
        
        .char-box span { position: relative; z-index: 2; }
        .char-box input { position: absolute; width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-size: 24px; font-family: "KaiTi", "楷体", serif; font-weight: bold; color: #2c3e50; z-index: 3; outline: none; padding: 0; top: 0; left: 0; }
        .char-box input:focus { background: rgba(22, 160, 133, 0.1); border: 2px solid var(--accent-color); }
        
        .punctuation { font-size: 24px; font-weight: bold; color: #7f8c8d; margin: 0 4px; align-self: center; font-family: "KaiTi", serif; }
        
        .control-panel { text-align: center; margin-top: 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .hint-text { margin-top: 15px; color: #e67e22; font-weight: bold; min-height: 24px; text-align: center; font-size: 16px; }
        
        .char-box.correct { border-color: #27ae60; background-color: #ebf5fb; }
        .char-box.wrong { border-color: #c0392b; background-color: #fdedec; }
    </style>
</head>
<body>

<div class="container">
    <div id="index-page">
        <h1>🎒 古诗词自主学习与默写系统</h1>
        
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('study')">📖 学习模式</button>
            <button class="tab-button" onclick="switchTab('test')">✏️ 测试模式</button>
        </div>
        
        <div id="study-panel" class="tab-content active">
            <div class="poem-grid" id="study-index-list"></div>
        </div>

        <div id="test-panel" class="tab-content">
            <div class="poem-grid" id="test-index-list"></div>
        </div>
    </div>

    <div id="content-page">
        <div class="nav-header">
            <button class="btn btn-secondary" onclick="backToIndex()">↩ 返回主目录</button>
            <div id="mode-badge-zone" class="current-mode-tag">模式标签</div>
            <div class="stat-badge" id="current-poem-status">独立完成: 0 次</div>
        </div>

        <div class="poem-title-view">
            <h2 id="view-title">古诗名称</h2>
            <div class="author-line" id="view-author-zone"></div>
        </div>

        <div class="poem-content-area" id="poem-render-box"></div>
        <div class="hint-text" id="status-message"></div>

        <div class="control-panel" id="test-control-panel">
            <button class="btn" id="btn-show-hint" onclick="giveOneCharacterHint()">💡 显示选中方格提示</button>
            <button class="btn btn-secondary" id="btn-reset-test" onclick="resetCurrentTest()">🔄 重置清空</button>
            <button class="btn" id="btn-submit-test" onclick="submitTestAnswers()" style="background:#27ae60;">✅ 提交核对</button>
        </div>
    </div>
</div>

<script>
    let currentPoem = null;
    let currentMode = 'study'; 
    let selectedBoxId = null;  
    let usedHintInCurrentTest = false; 

    function getStats() {
        let stats = localStorage.getItem('poem_completion_stats');
        return stats ? JSON.parse(stats) : {};
    }

    function saveStat(poemId) {
        let stats = getStats();
        stats[poemId] = (stats[poemId] || 0) + 1;
        localStorage.setItem('poem_completion_stats', JSON.stringify(stats));
    }

    // Tab 切换
    function switchTab(mode) {
        const buttons = document.querySelectorAll('.tab-button');
        
        buttons.forEach((btn, index) => {
            if((mode === 'study' && index === 0) || (mode === 'test' && index === 1)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        if (mode === 'study') {
            document.getElementById('study-panel').classList.add('active');
            document.getElementById('test-panel').classList.remove('active');
        } else {
            document.getElementById('study-panel').classList.remove('active');
            document.getElementById('test-panel').classList.add('active');
        }
    }

    // 首页列表渲染
    function renderIndex() {
        const studyList = document.getElementById('study-index-list');
        const testList = document.getElementById('test-index-list');
        studyList.innerHTML = '';
        testList.innerHTML = '';
        
        const stats = getStats();

        if (typeof poemDatabase === 'undefined') {
            studyList.innerHTML = "<p style='color:red;padding:10px;grid-column:1/-1;'>未检测到 poem_data.js 文件，请确保数据在同级目录下！</p>";
            return;
        }

        poemDatabase.forEach(poem => {
            const count = stats[poem.id] || 0;
            
            const studyCard = document.createElement('div');
            studyCard.className = 'poem-card';
            studyCard.onclick = () => openPoem(poem.id, 'study');
            studyCard.innerHTML = `
                <div class="poem-info">
                    <div class="title">${poem.title}</div>
                    <div class="author">${poem.author}</div>
                </div>
                <div class="stat-badge">📖 去背诵</div>
            `;
            studyList.appendChild(studyCard);

            const testCard = document.createElement('div');
            testCard.className = 'poem-card';
            testCard.onclick = () => openPoem(poem.id, 'test');
            testCard.innerHTML = `
                <div class="poem-info">
                    <div class="title">${poem.title}</div>
                    <div class="author">${poem.author}</div>
                </div>
                <div class="stat-badge ${count > 0 ? 'completed' : ''}">
                    🎯 独立完成: ${count} 次
                </div>
            `;
            testList.appendChild(testCard);
        });
    }

    // 进入古诗展示区
    function openPoem(id, mode) {
        currentPoem = poemDatabase.find(p => p.id === id);
        currentMode = mode;
        
        document.getElementById('index-page').style.display = 'none';
        document.getElementById('content-page').style.display = 'block';
        
        document.getElementById('view-title').innerText = currentPoem.title;
        
        const badge = document.getElementById('mode-badge-zone');
        const panel = document.getElementById('test-control-panel');
        document.getElementById('status-message').innerText = '';
        selectedBoxId = null;

        if (mode === 'study') {
            badge.innerText = "📖 学习模式";
            badge.className = "current-mode-tag tag-study";
            panel.style.display = 'none';
        } else {
            badge.innerText = "✏️ 测试模式";
            badge.className = "current-mode-tag tag-test";
            panel.style.display = 'flex';
            usedHintInCurrentTest = false; 
        }

        const stats = getStats();
        document.getElementById('current-poem-status').innerText = `独立完成: ${stats[id] || 0} 次`;
        
        renderAuthorZone();
        renderPoemContent();
    }

    function backToIndex() {
        document.getElementById('index-page').style.display = 'block';
        document.getElementById('content-page').style.display = 'none';
        renderIndex();
    }

    // ✨ 核心重构：动态渲染朝代与作者（测试模式下采用无字数提示的横线输入框）
    function renderAuthorZone() {
        const zone = document.getElementById('view-author-zone');
        zone.innerHTML = '';

        if (currentMode === 'study') {
            // 学习模式：直接完整显示“唐 · 李白”
            const span = document.createElement('span');
            span.className = 'author-text-node';
            span.innerText = currentPoem.author;
            zone.appendChild(span);
        } else {
            // 测试模式：提取出真实的朝代和作者数据
            // 例："唐 · 李白" 提取成 ["唐", "李白"]
            const parts = currentPoem.author.split('·');
            const targetDynasty = parts[0] ? parts[0].trim() : '';
            const targetName = parts[1] ? parts[1].trim() : '';

            // 1. 创建朝代整体输入框
            const dynastyInput = document.createElement('input');
            dynastyInput.type = 'text';
            dynastyInput.className = 'blank-input';
            dynastyInput.placeholder = '输入朝代';
            dynastyInput.id = 'test-dynasty';
            dynastyInput.dataset.answer = targetDynasty;
            
            // 2. 创建隔离点
            const punct = document.createElement('span');
            punct.className = 'punctuation';
            punct.innerText = ' · ';

            // 3. 创建作者姓名整体输入框
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'blank-input';
            nameInput.placeholder = '输入诗人';
            nameInput.id = 'test-author-name';
            nameInput.dataset.answer = targetName;

            // 回车或输入完自动切换焦点体验
            dynastyInput.oninput = function() {
                if(this.value.trim() === this.dataset.answer) {
                    nameInput.focus(); // 朝代输对了自动跳到名字框
                }
            };

            zone.appendChild(dynastyInput);
            zone.appendChild(punct);
            zone.appendChild(nameInput);
        }
    }

    // 渲染正文单字方格
    function renderPoemContent() {
        const renderBox = document.getElementById('poem-render-box');
        renderBox.innerHTML = '';
        let boxCounter = 0;

        currentPoem.lines.forEach(line => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'poem-line';
            if (line.includes('—') || !line.trim()) return;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (/[\u3002\uff0c\uff1f\uff01\uff1a\u3001]/.test(char)) {
                    const punctSpan = document.createElement('span');
                    punctSpan.className = 'punctuation';
                    punctSpan.innerText = char;
                    lineDiv.appendChild(punctSpan);
                } else if (char.trim() !== '') {
                    boxCounter++;
                    const currentNum = boxCounter; 
                    const boxId = `char-${currentNum}`;
                    const charBox = document.createElement('div');
                    charBox.className = 'char-box';
                    charBox.id = `box-${boxId}`;

                    if (currentMode === 'study') {
                        charBox.innerHTML = `<span>${char}</span>`;
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.id = boxId;
                        input.dataset.answer = char;
                        input.dataset.index = currentNum;
                        
                        input.onfocus = () => { selectedBoxId = boxId; };
                        
                        let isComposing = false;
                        input.addEventListener('compositionstart', () => { isComposing = true; });
                        input.addEventListener('compositionend', function() {
                            isComposing = false;
                            handleCharacterFlow(this, currentNum);
                        });
                        input.addEventListener('input', function() {
                            if (isComposing) return;
                            handleCharacterFlow(this, currentNum);
                        });
                        
                        charBox.appendChild(input);
                    }
                    lineDiv.appendChild(charBox);
                }
            }
            if (lineDiv.children.length > 0) {
                renderBox.appendChild(lineDiv);
            }
        });
    }

    // 处理正文汉字分流顺延
    function handleCharacterFlow(inputElement, currentNum) {
        const val = inputElement.value;
        if (val.length > 1) {
            const charsArray = val.split('');
            inputElement.value = charsArray[0]; 
            
            let targetIndex = currentNum + 1;
            for (let k = 1; k < charsArray.length; k++) {
                const nextInput = document.getElementById(`char-${targetIndex}`);
                if (nextInput) {
                    nextInput.value = charsArray[k];
                    targetIndex++;
                } else {
                    break;
                }
            }
            
            const finalFocusInput = document.getElementById(`char-${targetIndex}`);
            if (finalFocusInput) {
                finalFocusInput.focus();
            } else {
                const lastFilledInput = document.getElementById(`char-${targetIndex - 1}`);
                if (lastFilledInput) lastFilledInput.focus();
            }
        } else if (val.length === 1) {
            const nextInput = document.getElementById(`char-${currentNum + 1}`);
            if (nextInput) nextInput.focus();
        }
    }

    function resetCurrentTest() {
        renderAuthorZone();
        renderPoemContent();
        document.getElementById('status-message').innerText = '已重置并清空当前所有填写的格子。';
    }

    // 仅针对正文方格提供单个字提示
    function giveOneCharacterHint() {
        if (!selectedBoxId) {
            document.getElementById('status-message').innerText = '💡 请先用鼠标在上方点击选定一个【正文方格】！';
            return;
        }
        const inputTarget = document.getElementById(selectedBoxId);
        if (inputTarget) {
            inputTarget.value = inputTarget.dataset.answer;
            usedHintInCurrentTest = true; 
            document.getElementById('status-message').innerText = '💡 已为你显示该方格的正确汉字。';
            const currentNum = parseInt(inputTarget.dataset.index);
            const nextInput = document.getElementById(`char-${currentNum + 1}`);
            if (nextInput) nextInput.focus();
        }
    }

    // 提交并全面核对结果
    function submitTestAnswers() {
        let allCorrect = true;

        // 1. 核对朝代和作者名
        const dInput = document.getElementById('test-dynasty');
        const nInput = document.getElementById('test-author-name');
        
        if (dInput && nInput) {
            if (dInput.value.trim() === dInput.dataset.answer) {
                dInput.className = 'blank-input correct';
            } else {
                dInput.className = 'blank-input wrong';
                allCorrect = false;
            }

            if (nInput.value.trim() === nInput.dataset.answer) {
                nInput.className = 'blank-input correct';
            } else {
                nInput.className = 'blank-input wrong';
                allCorrect = false;
            }
        }

        // 2. 核对正文方格
        const inputs = document.querySelectorAll('.poem-content-area input');
        inputs.forEach(input => {
            const parentBox = document.getElementById(`box-${input.id}`);
            const userAnswer = input.value.trim();
            const correctAnswer = input.dataset.answer;

            if (userAnswer === correctAnswer) {
                parentBox.className = 'char-box correct';
            } else {
                parentBox.className = 'char-box wrong';
                allCorrect = false;
            }
        });

        const msgZone = document.getElementById('status-message');
        if (allCorrect) {
            if (!usedHintInCurrentTest) {
                saveStat(currentPoem.id);
                msgZone.innerHTML = '🎉 太棒了！朝代、作者和古诗正文全部默写正确！完美独立完成！';
                const stats = getStats();
                document.getElementById('current-poem-status').innerText = `独立完成: ${stats[currentPoem.id] || 0} 次`;
            } else {
                msgZone.innerHTML = '✨ 全都填对啦！不过本次测试由于使用了“方格字数提示”，不计入“独立完成”次数中。';
            }
        } else {
            msgZone.innerHTML = '❌ 检查出有内容填写错误或者尚未填写，请修改红框/红格处！';
        }
    }

    window.onload = function() {
        renderIndex();
    };
</script>

</body>
</html>
